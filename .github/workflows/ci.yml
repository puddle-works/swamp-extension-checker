name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - run: deno test --allow-read --allow-write extensions/models/
  contracts:
    uses: puddle-works/puddle-tooling/.github/workflows/contracts-check.yml@v0.1.1
    with:
      tooling-ref: v0.1.1
  guardrails:
    uses: puddle-works/puddle-tooling/.github/workflows/guardrails-check.yml@v0.1.1
    with:
      tooling-ref: v0.1.1
  # The publish dry run fails with "Version ... already exists" once the
  # manifest version is on the registry. Skip it then; a new version runs it again.
  version-check:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: check
        run: |
          name=$(sed -n 's/^name: *"\(.*\)"/\1/p' manifest.yaml)
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' manifest.yaml)
          code=$(curl -sL -o versions.json -w '%{http_code}' \
            "https://swamp.club/api/v1/extensions/${name}/versions?perPage=100")
          case "$code" in
            200) jq -e --arg v "$version" '.versions | any(.version == $v)' versions.json >/dev/null \
                   && published=true || published=false ;;
            404) published=false ;;
            *) echo "registry answered HTTP $code" >&2; exit 1 ;;
          esac
          echo "$name $version published=$published"
          echo "published=$published" >> "$GITHUB_OUTPUT"
  publish:
    needs: version-check
    if: needs.version-check.outputs.published != 'true'
    uses: puddle-works/puddle-tooling/.github/workflows/publish.yml@v0.1.1
    with:
      visibility: public # must equal visibility: in manifest.yaml
      dry-run: true # false pushes
      tests: deno test --allow-read --allow-write extensions/models/
      tooling-ref: v0.1.1
    secrets:
      SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
      SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
