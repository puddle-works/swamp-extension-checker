id: 3def8ae8-d07e-4cf1-ae76-8642fac519ac
name: "@puddleworks/swamp-extension-checker-licence-recipe"
description: "The recipe @puddleworks/recipes answers \"does owner/name have a licence?\" with: it checks the named GitHub repository."
version: 1
tags:
  maxReruns: "5"
  maxWallClock: "30m"
  puddlerouterRecipe: '{"id":"swamp-extension-checker-licence","extension":"@puddleworks/swamp-extension-checker","pattern":"^does ([\\w.-]+/[\\w.-]+) have an? licen[cs]e(?: file)?[?.!]?$","dataName":"result","inputs":{"repo":{"capture":1,"as":"repo"}},"each":{"path":"items","line":"{answer}"},"template":"{lines}"}'

inputs:
  type: object
  properties:
    repo:
      type: string
      description: "A GitHub repository as owner/name."
  required: [repo]

jobs:
  - name: main
    description: "Check the named GitHub repository for a licence file."
    dependsOn: []
    weight: 0
    steps:
      - name: run
        description: "One record saying whether the repository has a licence file at its root, which file it is and its SPDX name."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: swamp-extension-checker-model
          methodName: run
          inputs:
            repo: ${{ inputs.repo }}
